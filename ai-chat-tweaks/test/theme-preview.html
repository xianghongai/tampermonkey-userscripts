<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat Tweaks · 消息气泡配色方案</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --ai-bg: #f3f4f6;
      --ai-text: #1f2937;
      --accent: #52525b;
      --card-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
    }

    [data-theme="dark"] {
      --bg: #0b0f16;
      --surface: #121722;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #232b38;
      --ai-bg: #1c2431;
      --ai-text: #e5e7eb;
      --accent: #d4d4d8;
      --card-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 56px 20px 96px;
      transition: background .2s, color .2s;
    }

    .container { max-width: 720px; margin: 0 auto; }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    h1 { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }

    .subtitle { font-size: 13px; color: var(--muted); margin-top: 6px; max-width: 460px; }

    .segmented {
      display: flex;
      padding: 3px;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .segmented button {
      padding: 5px 14px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .segmented button.active { background: var(--accent); color: #fff; }

    [data-theme="dark"] .segmented button.active { color: #18181b; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .title-row { display: flex; align-items: baseline; gap: 8px; }

    h2 { font-size: 15px; font-weight: 600; }

    h2 .en { font-size: 13px; font-weight: 400; color: var(--muted); }

    .swatches { display: flex; align-items: center; gap: 8px; }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(127, 127, 127, .25);
    }

    .hex { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .preview {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-ai {
      align-self: flex-start;
      max-width: 78%;
      background: var(--ai-bg);
      color: var(--ai-text);
      padding: 10px 15px;
      border-radius: 16px;
      font-size: 14px;
    }

    .msg-user {
      width: 68%;
      max-width: 100%;
      margin-left: auto;
      padding: 10px 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .variants { display: flex; flex-direction: column; gap: 14px; }

    .variant { display: flex; align-items: center; gap: 14px; }

    .variant-label {
      flex: 0 0 52px;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }

    .variant .msg-user { width: auto; flex: 1; }

    details { border-top: 1px solid var(--border); }

    summary {
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
      padding: 10px 20px;
    }

    pre {
      margin: 0 20px 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .footnote {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="page-head">
      <div>
        <h1>消息气泡配色方案</h1>
        <p class="subtitle">一套扁平风格，一组中性灰加七组带颜色的。纯色底 + 一层细描边 + 一层柔和投影，圆角 16px；底色跟着站点的深浅色界面切换，浅色界面浅色底深字，深色界面深色底浅字。每张卡里摆几种描边做法：浅灰与浅色系有亮色边和实色边，饱和色系有实色边和粗边。实色边都带一层轻度拟物的凹刻效果，边框凹进去，气泡表面微微凸起。</p>
      </div>
      <div class="segmented">
        <button id="btn-light" class="active">浅色</button>
        <button id="btn-dark">深色</button>
      </div>
    </header>

    <main id="gallery"></main>

    <p class="footnote">选定后把对应 CSS 写进 ai-chat-tweaks.user.js 的 BUBBLE_PRESETS。</p>
  </div>

  <script>
    // ---------- 方案数据 ----------

        dark: { background: '#4a2a35', color: '#fbe9ef', border: '1px solid rgba(255, 255, 255, .09)', shadow: '0 1px 2px rgba(0, 0, 0, .35), 0 2px 8px rgba(0, 0, 0, .3)' },
        variants: [
          { zh: '亮色边', light: { border: '1px solid #ffffff', shadow: '0 0 0 1px rgba(61, 20, 33, .065), 0 0 6px rgba(61, 20, 33, .07)' }, dark: { border: '1px solid rgba(255, 255, 255, .26)', shadow: '0 0 0 1px rgba(38, 12, 24, .3), 0 0 8px rgba(38, 12, 24, .27)' } },
          { zh: '实色边', light: { border: '1px solid #e9bfcd', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .45), inset 1px 0 0 rgba(255, 255, 255, .45), inset -1px 0 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(255, 255, 255, .45), inset 0 6px 10px -6px rgba(255, 255, 255, .4), inset 0 -8px 12px -8px rgba(16, 24, 40, .04), 0 2px 4px rgba(16, 24, 40, .05), 0 6px 14px rgba(16, 24, 40, .05)' }, dark: { border: '1px solid #6b3d4c', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .06), inset 1px 0 0 rgba(255, 255, 255, .06), inset -1px 0 0 rgba(255, 255, 255, .06), inset 0 -1px 0 rgba(255, 255, 255, .06), inset 0 6px 10px -6px rgba(255, 255, 255, .05), inset 0 -8px 12px -8px rgba(0, 0, 0, .15), 0 2px 4px rgba(0, 0, 0, .2), 0 6px 14px rgba(0, 0, 0, .18)' } },
        ],
      },
      {
        key: 'lavender',
        zh: '薰衣草',
        en: 'Lavender',
        light: { background: '#e4e0f5', color: '#262140', border: '1px solid rgba(15, 23, 42, .07)', shadow: '0 1px 2px rgba(16, 24, 40, .06), 0 2px 6px rgba(16, 24, 40, .06)' },
        dark: { background: '#2f2a45', color: '#ece9f8', border: '1px solid rgba(255, 255, 255, .09)', shadow: '0 1px 2px rgba(0, 0, 0, .35), 0 2px 8px rgba(0, 0, 0, .3)' },
        variants: [
          { zh: '亮色边', light: { border: '1px solid #ffffff', shadow: '0 0 0 1px rgba(38, 33, 64, .065), 0 0 6px rgba(38, 33, 64, .07)' }, dark: { border: '1px solid rgba(255, 255, 255, .26)', shadow: '0 0 0 1px rgba(20, 16, 38, .3), 0 0 8px rgba(20, 16, 38, .27)' } },
          { zh: '实色边', light: { border: '1px solid #c9c3e6', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .45), inset 1px 0 0 rgba(255, 255, 255, .45), inset -1px 0 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(255, 255, 255, .45), inset 0 6px 10px -6px rgba(255, 255, 255, .4), inset 0 -8px 12px -8px rgba(16, 24, 40, .04), 0 2px 4px rgba(16, 24, 40, .05), 0 6px 14px rgba(16, 24, 40, .05)' }, dark: { border: '1px solid #433d60', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .06), inset 1px 0 0 rgba(255, 255, 255, .06), inset -1px 0 0 rgba(255, 255, 255, .06), inset 0 -1px 0 rgba(255, 255, 255, .06), inset 0 6px 10px -6px rgba(255, 255, 255, .05), inset 0 -8px 12px -8px rgba(0, 0, 0, .15), 0 2px 4px rgba(0, 0, 0, .2), 0 6px 14px rgba(0, 0, 0, .18)' } },
        ],
      },
      {
        key: 'amber',
        zh: '琥珀',
        en: 'Amber',
        light: { background: '#f6e3c4', color: '#3a2508', border: '1px solid rgba(15, 23, 42, .07)', shadow: '0 1px 2px rgba(16, 24, 40, .06), 0 2px 6px rgba(16, 24, 40, .06)' },
        dark: { background: '#4a3816', color: '#fbeed8', border: '1px solid rgba(255, 255, 255, .09)', shadow: '0 1px 2px rgba(0, 0, 0, .35), 0 2px 8px rgba(0, 0, 0, .3)' },
        variants: [
          { zh: '亮色边', light: { border: '1px solid #ffffff', shadow: '0 0 0 1px rgba(58, 37, 8, .065), 0 0 6px rgba(58, 37, 8, .07)' }, dark: { border: '1px solid rgba(255, 255, 255, .26)', shadow: '0 0 0 1px rgba(45, 28, 6, .3), 0 0 8px rgba(45, 28, 6, .27)' } },
          { zh: '实色边', light: { border: '1px solid #e6cb9c', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .45), inset 1px 0 0 rgba(255, 255, 255, .45), inset -1px 0 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(255, 255, 255, .45), inset 0 6px 10px -6px rgba(255, 255, 255, .4), inset 0 -8px 12px -8px rgba(16, 24, 40, .04), 0 2px 4px rgba(16, 24, 40, .05), 0 6px 14px rgba(16, 24, 40, .05)' }, dark: { border: '1px solid #6b5224', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .06), inset 1px 0 0 rgba(255, 255, 255, .06), inset -1px 0 0 rgba(255, 255, 255, .06), inset 0 -1px 0 rgba(255, 255, 255, .06), inset 0 6px 10px -6px rgba(255, 255, 255, .05), inset 0 -8px 12px -8px rgba(0, 0, 0, .15), 0 2px 4px rgba(0, 0, 0, .2), 0 6px 14px rgba(0, 0, 0, .18)' } },
        ],
      },
      {
        key: 'lime',
        zh: '青柠',
        en: 'Lime',
        light: { background: '#e3f1c9', color: '#22300f', border: '1px solid rgba(15, 23, 42, .07)', shadow: '0 1px 2px rgba(16, 24, 40, .06), 0 2px 6px rgba(16, 24, 40, .06)' },
        dark: { background: '#3a4a22', color: '#f2f8e2', border: '1px solid rgba(255, 255, 255, .09)', shadow: '0 1px 2px rgba(0, 0, 0, .35), 0 2px 8px rgba(0, 0, 0, .3)' },
        variants: [
          { zh: '亮色边', light: { border: '1px solid #ffffff', shadow: '0 0 0 1px rgba(34, 48, 15, .065), 0 0 6px rgba(34, 48, 15, .07)' }, dark: { border: '1px solid rgba(255, 255, 255, .26)', shadow: '0 0 0 1px rgba(28, 38, 12, .3), 0 0 8px rgba(28, 38, 12, .27)' } },
          { zh: '实色边', light: { border: '1px solid #c6dc9c', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .45), inset 1px 0 0 rgba(255, 255, 255, .45), inset -1px 0 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(255, 255, 255, .45), inset 0 6px 10px -6px rgba(255, 255, 255, .4), inset 0 -8px 12px -8px rgba(16, 24, 40, .04), 0 2px 4px rgba(16, 24, 40, .05), 0 6px 14px rgba(16, 24, 40, .05)' }, dark: { border: '1px solid #546b30', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .06), inset 1px 0 0 rgba(255, 255, 255, .06), inset -1px 0 0 rgba(255, 255, 255, .06), inset 0 -1px 0 rgba(255, 255, 255, .06), inset 0 6px 10px -6px rgba(255, 255, 255, .05), inset 0 -8px 12px -8px rgba(0, 0, 0, .15), 0 2px 4px rgba(0, 0, 0, .2), 0 6px 14px rgba(0, 0, 0, .18)' } },
        ],
      },
      {
        key: 'blue',
        zh: '经典蓝',
        en: 'Classic Blue',
        light: { background: '#2563eb', color: '#ffffff', border: '1px solid rgba(29, 78, 216, .75)', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .25), 0 1px 2px rgba(16, 24, 40, .1), 0 4px 12px rgba(37, 99, 235, .32)' },
        dark: { background: '#3b82f6', color: '#ffffff', border: '1px solid rgba(96, 165, 250, .45)', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .16), 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(59, 130, 246, .35)' },
        // 描边做法并排对比：不透明实色边（带凹刻效果）、加粗到 2px 的同色边
        variants: [
          { zh: '实色边', light: { border: '1px solid #1d4ed8', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .3), inset 1px 0 0 rgba(255, 255, 255, .3), inset -1px 0 0 rgba(255, 255, 255, .3), inset 0 -1px 0 rgba(255, 255, 255, .3), inset 0 6px 10px -6px rgba(255, 255, 255, .25), inset 0 -8px 12px -8px rgba(15, 23, 42, .12), 0 2px 4px rgba(37, 99, 235, .2), 0 6px 14px rgba(37, 99, 235, .25)' }, dark: { border: '1px solid #60a5fa', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .12), inset 1px 0 0 rgba(255, 255, 255, .12), inset -1px 0 0 rgba(255, 255, 255, .12), inset 0 -1px 0 rgba(255, 255, 255, .12), inset 0 6px 10px -6px rgba(255, 255, 255, .1), inset 0 -8px 12px -8px rgba(0, 0, 0, .18), 0 2px 4px rgba(0, 0, 0, .3), 0 6px 14px rgba(59, 130, 246, .3)' } },
          { zh: '粗边', light: { border: '2px solid rgba(29, 78, 216, .75)' }, dark: { border: '2px solid rgba(96, 165, 250, .45)' } },
        ],
      },
      {
        key: 'emerald',
        zh: '翡翠绿',
        en: 'Emerald',
        light: { background: '#059669', color: '#ffffff', border: '1px solid rgba(4, 120, 87, .75)', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .25), 0 1px 2px rgba(16, 24, 40, .1), 0 4px 12px rgba(5, 150, 105, .32)' },
        dark: { background: '#10b981', color: '#042f22', border: '1px solid rgba(52, 211, 153, .45)', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .18), 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(16, 185, 129, .35)' },
        variants: [
          { zh: '实色边', light: { border: '1px solid #047857', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .3), inset 1px 0 0 rgba(255, 255, 255, .3), inset -1px 0 0 rgba(255, 255, 255, .3), inset 0 -1px 0 rgba(255, 255, 255, .3), inset 0 6px 10px -6px rgba(255, 255, 255, .25), inset 0 -8px 12px -8px rgba(15, 23, 42, .12), 0 2px 4px rgba(5, 150, 105, .2), 0 6px 14px rgba(5, 150, 105, .25)' }, dark: { border: '1px solid #34d399', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .12), inset 1px 0 0 rgba(255, 255, 255, .12), inset -1px 0 0 rgba(255, 255, 255, .12), inset 0 -1px 0 rgba(255, 255, 255, .12), inset 0 6px 10px -6px rgba(255, 255, 255, .1), inset 0 -8px 12px -8px rgba(0, 0, 0, .18), 0 2px 4px rgba(0, 0, 0, .3), 0 6px 14px rgba(16, 185, 129, .3)' } },
          { zh: '粗边', light: { border: '2px solid rgba(4, 120, 87, .75)' }, dark: { border: '2px solid rgba(52, 211, 153, .45)' } },
        ],
      },
      {
        key: 'rose',
        zh: '玫瑰红',
        en: 'Rose',
        light: { background: '#e11d48', color: '#ffffff', border: '1px solid rgba(190, 18, 60, .75)', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .25), 0 1px 2px rgba(16, 24, 40, .1), 0 4px 12px rgba(225, 29, 72, .32)' },
        dark: { background: '#f43f5e', color: '#ffffff', border: '1px solid rgba(251, 113, 133, .45)', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .16), 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(244, 63, 94, .35)' },
        variants: [
          { zh: '实色边', light: { border: '1px solid #be123c', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .3), inset 1px 0 0 rgba(255, 255, 255, .3), inset -1px 0 0 rgba(255, 255, 255, .3), inset 0 -1px 0 rgba(255, 255, 255, .3), inset 0 6px 10px -6px rgba(255, 255, 255, .25), inset 0 -8px 12px -8px rgba(15, 23, 42, .12), 0 2px 4px rgba(225, 29, 72, .2), 0 6px 14px rgba(225, 29, 72, .25)' }, dark: { border: '1px solid #fb7185', shadow: 'inset 0 1px 0 rgba(255, 255, 255, .12), inset 1px 0 0 rgba(255, 255, 255, .12), inset -1px 0 0 rgba(255, 255, 255, .12), inset 0 -1px 0 rgba(255, 255, 255, .12), inset 0 6px 10px -6px rgba(255, 255, 255, .1), inset 0 -8px 12px -8px rgba(0, 0, 0, .18), 0 2px 4px rgba(0, 0, 0, .3), 0 6px 14px rgba(244, 63, 94, .3)' } },
          { zh: '粗边', light: { border: '2px solid rgba(190, 18, 60, .75)' }, dark: { border: '2px solid rgba(251, 113, 133, .45)' } },
        ],
      },
    ];

    // ---------- 渲染 ----------
    const gallery = document.getElementById('gallery');
    let mode = 'light';

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const cssText = (s) => [
      `background: ${s.background};`,
      `color: ${s.color};`,
      `border: ${s.border};`,
      `box-shadow: ${s.shadow};`,
      'border-radius: 16px;',
    ].join('\n');

    const bubbleStyle = (s) => [
      `background: ${s.background}`,
      `color: ${s.color}`,
      `border: ${s.border}`,
      `box-shadow: ${s.shadow}`,
      'border-radius: 16px',
    ].join('; ');

    const render = () => {
      gallery.innerHTML = PRESETS.map((p) => {
        const s = p[mode];
        // 带 variants 的卡片并排摆出几种描边做法，其余卡片只摆一个气泡
        const bubbles = p.variants
          ? `<div class="variants">${p.variants.map((v) => `
              <div class="variant">
                <span class="variant-label">${esc(v.zh)}</span>
                <div class="msg-user" style="${bubbleStyle({ ...s, ...v[mode] })}">这个底色在浅色和深色界面上都够清楚，切换的时候不会晃眼。</div>
              </div>`).join('')}</div>`
          : `<div class="msg-user" style="${bubbleStyle(s)}">这个底色在浅色和深色界面上都够清楚，切换的时候不会晃眼。</div>`;
        return `<article class="card">
          <div class="card-head">
            <div class="title-row">
              <h2>${esc(p.zh)}<span class="en">${esc(p.en)}</span></h2>
            </div>
            <div class="swatches">
              <span class="hex">${esc(s.background)}</span>
              <span class="swatch" style="background: ${esc(s.background)}"></span>
            </div>
          </div>
          <div class="preview">
            <div class="msg-ai">收到，我把配色换成这一档。</div>
            ${bubbles}
          </div>
          <details>
            <summary>查看 CSS（脚本当前用的，${mode === 'light' ? '浅色' : '深色'}模式）</summary>
            <pre>${esc(cssText(s))}</pre>
          </details>
        </article>`;
      }).join('');
    };

    const setMode = (next) => {
      mode = next;
      document.documentElement.setAttribute('data-theme', next);
      document.getElementById('btn-light').classList.toggle('active', next === 'light');
      document.getElementById('btn-dark').classList.toggle('active', next === 'dark');
      render();
    };

    document.getElementById('btn-light').addEventListener('click', () => setMode('light'));
    document.getElementById('btn-dark').addEventListener('click', () => setMode('dark'));

    render();
  </script>
</body>
</html>
