<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>双击关闭标签页 测试页</title>
  <!--
    用法：用浏览器直接打开本文件（file://），不需要安装到 Tampermonkey。
    页面先替换 window.close 用来计数，再引入仓库公共的 Tampermonkey API 替身 ../../test/gm-mock.js 与脚本本体，所以手动双击也不会真的关掉本页。
    file:// 页面的域名为空，路径是本文件在磁盘上的路径，排除规则写成以 / 开头、不带域名的键来测试。
  -->
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0 auto; max-width: 960px; padding: 24px 16px; font: 14px/1.6 system-ui, sans-serif; }
    h1 { font-size: 20px; }
    h2 { margin-top: 32px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 4px 8px; border-bottom: 1px solid #8884; text-align: left; vertical-align: top; }
    .pass { color: #1a7f37; }
    .fail { color: #cf222e; font-weight: 600; }
    .sample { padding: 8px 12px; border: 1px dashed #8888; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>双击关闭标签页 测试页</h1>

  <h2>自动测试</h2>
  <p><button id="run" type="button">运行自动测试</button> <span id="summary"></span></p>
  <table>
    <thead><tr><th>场景</th><th>期望</th><th>实际</th><th>结果</th></tr></thead>
    <tbody id="results"></tbody>
  </table>

  <h2>样例内容</h2>
  <p>手动按住 Shift 双击下面各处，关闭被拦截为计数：<strong id="count">0</strong> 次。</p>
  <div class="sample">
    <p id="text">Plain text area.</p>
    <p><a id="link" href="#"><span id="link-inner">A link</span></a></p>
    <p><input id="input" value="input"> <textarea id="textarea">textarea</textarea></p>
    <div id="editable" contenteditable>Editable area</div>
    <div id="not-editable" contenteditable="false">contenteditable="false" area</div>
    <div id="host"></div>
    <div id="stopper">A page handler that stops dblclick from bubbling.</div>
  </div>

  <script>
    // 替换 window.close：只计数，不关闭本页
    let closed = 0;
    window.close = () => {
      closed += 1;
      document.getElementById('count').textContent = closed;
    };
  </script>
  <script src="../../test/gm-mock.js" data-name="Double-click to Close (test page)"></script>
  <script src="../double-click-to-close.user.js"></script>
  <script>
    document.getElementById('host').attachShadow({ mode: 'open' }).innerHTML = '<b id="inner">Shadow text</b>';
    document.getElementById('stopper').addEventListener('dblclick', (event) => event.stopPropagation());
  </script>
  <script>
    // ---------- 自动测试 ----------
    const $ = (id) => document.getElementById(id);
    const SHIFT = { shiftKey: true };

    // 派发一次双击，返回本次是否触发了关闭
    function dblclick(el, opts = SHIFT) {
      const before = closed;
      el.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, composed: true, cancelable: true, button: 0, detail: 2, ...opts }));
      return closed > before;
    }

    const cases = [
      ['首次运行写入空的排除列表', async () => JSON.stringify(GM_mock.values.get('exclude')), '[]'],
      ['Shift+双击文字：关闭', async () => dblclick($('text')), true],
      ['普通双击：不关闭', async () => dblclick($('text'), {}), false],
      ['Ctrl/Alt/⌘+Shift+双击：不关闭', async () => [
        dblclick($('text'), { ...SHIFT, ctrlKey: true }),
        dblclick($('text'), { ...SHIFT, altKey: true }),
        dblclick($('text'), { ...SHIFT, metaKey: true }),
      ].join(','), 'false,false,false'],
      ['右键双击：不关闭', async () => dblclick($('text'), { ...SHIFT, button: 2 }), false],
      ['链接及其内部元素：不关闭', async () => [dblclick($('link')), dblclick($('link-inner'))].join(','), 'false,false'],
      ['输入框、多行输入框：不关闭', async () => [dblclick($('input')), dblclick($('textarea'))].join(','), 'false,false'],
      ['可编辑区域：不关闭', async () => dblclick($('editable')), false],
      ['contenteditable="false"：关闭', async () => dblclick($('not-editable')), true],
      ['Shadow DOM 内的文字：关闭', async () => dblclick($('host').shadowRoot.getElementById('inner')), true],
      ['页面阻止冒泡也能关闭', async () => dblclick($('stopper')), true],
      ['当前路径被排除：不关闭', async () => {
        const dir = location.pathname.slice(0, location.pathname.lastIndexOf('/'));
        GM_mock.values.set('exclude', [dir]);
        const result = dblclick($('text'));
        GM_mock.values.set('exclude', []);
        return result;
      }, false],
      ['排除其他网站不影响本页', async () => {
        GM_mock.values.set('exclude', ['example.com']);
        const result = dblclick($('text'));
        GM_mock.values.set('exclude', []);
        return result;
      }, true],
    ];

    $('run').addEventListener('click', async () => {
      const tbody = $('results');
      tbody.textContent = '';
      let failed = 0;
      for (const [name, run, expected] of cases) {
        let actual;
        try {
          actual = await run();
        } catch (err) {
          actual = `Error: ${err.message}`;
        }
        const ok = actual === expected;
        if (!ok) failed += 1;
        const row = tbody.insertRow();
        row.insertCell().textContent = name;
        row.insertCell().textContent = JSON.stringify(expected);
        row.insertCell().textContent = JSON.stringify(actual);
        const result = row.insertCell();
        result.textContent = ok ? '通过' : '失败';
        result.className = ok ? 'pass' : 'fail';
      }
      const summary = $('summary');
      summary.textContent = failed ? `${failed} 项失败，共 ${cases.length} 项` : `全部通过，共 ${cases.length} 项`;
      summary.className = failed ? 'fail' : 'pass';
    });
  </script>
</body>
</html>
