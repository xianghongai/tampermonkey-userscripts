<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode: Split Models 测试页</title>
  <!--
    用法：用浏览器直接打开本页，不需要安装到 Tampermonkey。
    页面里的表格模仿控制台的 Models 页面：表头七列，可排序的列包成按钮并在文字后带一个箭头（↕），
    模型行的最后一列是 role="switch" 的开关。
    另有一张表头不同的表格，用来确认脚本不改动它。
    用例按顺序执行，后面的用例基于前面改动后的状态；刷新页面即可重新运行。
  -->
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 24px 16px; font: 14px/1.6 system-ui, sans-serif; }
    h1 { font-size: 20px; }
    h2 { margin-top: 32px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 4px 8px; border-bottom: 1px solid #8884; text-align: left; vertical-align: top; }
    .pass { color: #1a7f37; }
    .fail { color: #cf222e; font-weight: 600; }
    code { white-space: pre-wrap; word-break: break-all; }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .sort { display: inline-flex; gap: 4px; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>OpenCode: Split Models 测试页</h1>

  <h2>自动测试</h2>
  <p id="summary">运行中……</p>
  <table>
    <thead><tr><th>场景</th><th>期望</th><th>实际</th><th>结果</th></tr></thead>
    <tbody id="results"></tbody>
  </table>

  <h2>模拟的 Models 表格</h2>
  <div class="toolbar">
    <input type="search" placeholder="Search">
    <button type="button" aria-label="Model actions">⋯</button>
  </div>
  <table id="models">
    <thead>
      <tr>
        <th><button type="button" class="sort"><span>Model</span><span>↕</span></button></th>
        <th>Features</th>
        <th><button type="button" class="sort"><span>Input</span><span>↕</span></button></th>
        <th><button type="button" class="sort"><span>Output</span><span>↕</span></button></th>
        <th><button type="button" class="sort"><span>Cache Read</span><span>↕</span></button></th>
        <th><button type="button" class="sort"><span>Cache Write</span><span>↕</span></button></th>
        <th><button type="button" class="sort"><span>Enabled</span><span>↕</span></button></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>其他表格（不应被改动）</h2>
  <table id="other">
    <thead><tr><th>Name</th><th>Enabled</th></tr></thead>
    <tbody>
      <tr><td>Sidebar item</td><td><input type="checkbox" role="switch" aria-checked="true" aria-label="Sidebar item enabled"></td></tr>
    </tbody>
  </table>

  <!-- 按页面顺序生成模型行：名称顺序与开关状态混杂，用来验证分组保持页面的顺序 -->
  <script>
    // 名称、开关状态与价格；价格只让模拟表格与真实页面的列一致，脚本不读它
    const FIXTURE = [
      ['Foxtrot', true, '$3.00', '$9.00'],
      ['Bravo', false, '$1.00', '$5.00'],
      ['Charlie', true, '$2.00', '$6.00'],
      ['Alpha', false, '$2.00', '$1.00'],
      ['Echo', false, '$0.50', '$2.00'],
      ['Delta', true, '$1.00', '$3.00'],
      ['GLM-5', false, '$4.00', '$8.00'],
      ['Gemini 3', false, '$1.00', '$4.00'],
    ];
    const tbody = document.querySelector('#models tbody');
    // 页面重建行时用的是新节点；测试里也用新节点模拟
    function makeRow(name, on) {
      const [, , input, output] = FIXTURE.find(([n]) => n === name);
      const id = name.toLowerCase().replace(/\s+/g, '-');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><div><span class="break-words"><span>${name}</span></span> <span title="${id}">${id}</span></div></td>
        <td>-</td><td>${input}</td><td>${output}</td><td>-</td><td>-</td>
        <td><input type="checkbox" role="switch" aria-checked="${on}" aria-label="${name} enabled"></td>`;
      return tr;
    }
    for (const [name, on] of FIXTURE) tbody.append(makeRow(name, on));
  </script>

  <!-- 记录控制台输出，用来确认脚本加载时只输出脚本名。须放在脚本本体之前 -->
  <script>
    window.consoleLogs = [];
    const originalLog = console.log;
    console.log = (...args) => {
      window.consoleLogs.push(args);
      originalLog(...args);
    };
  </script>

  <!-- 分组开关的状态记在 localStorage 里，每次运行前清掉，保证从默认状态（开启）开始 -->
  <script>
    try {
      localStorage.removeItem('user-script-opencode-split-models-grouped');
    } catch {
      // 无法访问存储时不影响测试
    }
  </script>

  <script src="../../__tests__/gm-mock.js" data-name="OpenCode: Split Models (test page)"></script>
  <script src="../opencode-split-models.user.js"></script>

  <script>
    const GROUP_ATTR = 'data-user-script-opencode-split-models-group';
    const GROUP_CLASS = 'user-script-opencode-split-models-group';
    const otherTbody = document.querySelector('#other tbody');
    // 脚本在下一帧统一整理，等到那一帧结束后再读取结果
    const settle = () => new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 0)));

    const nameOf = (tr) => tr.cells[0].querySelector('.break-words')?.textContent.trim() ?? tr.textContent.trim();
    const rowOf = (name) => [...tbody.rows].find((tr) => nameOf(tr) === name);
    const toggleOf = (name) => rowOf(name).cells[6].querySelector('input[role="switch"]');
    // 开关状态记在页面之外：搜索时行会被删掉，重建时仍要恢复原来的状态
    const switchState = new Map(FIXTURE.map(([name, on]) => [name, String(on)]));
    const setOn = (name, on) => {
      switchState.set(name, String(on));
      toggleOf(name).setAttribute('aria-checked', String(on));
    };
    // 按页面顺序列出：分组标题取文字，模型行取名称
    const seq = () => [...tbody.children].map((tr) => (tr.hasAttribute(GROUP_ATTR) ? tr.textContent.trim() : nameOf(tr)));

    // 页面点表头排序时会整批重建行：删掉旧行，按新顺序创建新节点。
    // 用同样的方式模拟，确认分组之后仍然保持页面的顺序。
    const PAGE_ORDER = FIXTURE.map(([name]) => name);
    function siteRender(order) {
      for (const tr of [...tbody.rows]) {
        if (tr.querySelector('input[role="switch"]')) tr.remove();
      }
      for (const name of order) tbody.append(makeRow(name, switchState.get(name)));
    }

    const cases = [
      {
        name: '加载后自动分成两组：标题带数量，组内保持页面的顺序',
        run: () => seq(),
        expected: ['Enabled models (3)', 'Foxtrot', 'Charlie', 'Delta', 'Disabled models (5)', 'Bravo', 'Alpha', 'Echo', 'GLM-5', 'Gemini 3'],
      },
      {
        name: '每组一个标题，标题横跨全部 7 列',
        run: () => [...tbody.querySelectorAll(`tr[${GROUP_ATTR}]`)].map((tr) => tr.cells[0].colSpan),
        expected: [7, 7],
      },
      {
        name: '脚本只在加载时输出脚本名',
        run: () => window.consoleLogs.map((args) => args[0]),
        expected: ['OpenCode: Split Models (test page)'],
      },
      {
        name: '其他表格的行数不变，也没有被加上脚本的类名',
        run: () => [otherTbody.rows.length, document.querySelectorAll('#other [class*="user-script-opencode-split-models"]').length],
        expected: [1, 0],
      },
      {
        name: '开关打开（aria-checked 变化）后，模型移到已启用组，并保持它在页面中的位置',
        run: async () => {
          setOn('Bravo', true);
          await settle();
          return seq();
        },
        expected: ['Enabled models (4)', 'Foxtrot', 'Bravo', 'Charlie', 'Delta', 'Disabled models (4)', 'Alpha', 'Echo', 'GLM-5', 'Gemini 3'],
      },
      {
        name: '开关关闭后，模型移到未启用组，并保持它在页面中的位置',
        run: async () => {
          setOn('Foxtrot', false);
          await settle();
          return seq();
        },
        expected: ['Enabled models (3)', 'Bravo', 'Charlie', 'Delta', 'Disabled models (5)', 'Foxtrot', 'Alpha', 'Echo', 'GLM-5', 'Gemini 3'],
      },
      {
        name: '移动后焦点仍在原来的开关上',
        run: async () => {
          toggleOf('Charlie').focus();
          setOn('Charlie', false);
          await settle();
          return document.activeElement === toggleOf('Charlie');
        },
        expected: true,
      },
      {
        name: '焦点用例之后，两组的计数与顺序正确',
        run: () => seq(),
        expected: ['Enabled models (2)', 'Bravo', 'Delta', 'Disabled models (6)', 'Foxtrot', 'Charlie', 'Alpha', 'Echo', 'GLM-5', 'Gemini 3'],
      },
      {
        name: '搜索时框架删掉不匹配的行（这里用名称含 e 模拟），两组只剩匹配的行',
        run: async () => {
          for (const tr of [...tbody.rows]) {
            if (!tr.hasAttribute(GROUP_ATTR) && !/e/i.test(nameOf(tr))) tr.remove();
          }
          await settle();
          return seq();
        },
        expected: ['Enabled models (1)', 'Delta', 'Disabled models (3)', 'Charlie', 'Echo', 'Gemini 3'],
      },
      {
        name: '搜索清空后，页面整批重建行，两组恢复并按页面顺序排列',
        run: async () => {
          siteRender(PAGE_ORDER);
          await settle();
          return seq();
        },
        expected: ['Enabled models (2)', 'Bravo', 'Delta', 'Disabled models (6)', 'Foxtrot', 'Charlie', 'Alpha', 'Echo', 'GLM-5', 'Gemini 3'],
      },
      {
        name: '没有开关的行（例如空状态提示）不参与分组，留在最后',
        run: async () => {
          const placeholder = document.createElement('tr');
          placeholder.innerHTML = '<td colspan="7">No more models</td>';
          tbody.append(placeholder);
          await settle();
          const result = [tbody.lastElementChild.textContent.trim(), seq().length];
          placeholder.remove();
          return result;
        },
        expected: ['No more models', 11],
      },
      {
        name: '多出来的同名分组标题被删掉，只保留一个，列表不变',
        run: async () => {
          const stale = document.createElement('tr');
          stale.className = GROUP_CLASS;
          stale.setAttribute(GROUP_ATTR, 'enabled');
          tbody.append(stale);
          await settle();
          return [document.querySelectorAll(`tr[${GROUP_ATTR}="enabled"]`).length, seq()];
        },
        expected: [1, ['Enabled models (2)', 'Bravo', 'Delta', 'Disabled models (6)', 'Foxtrot', 'Charlie', 'Alpha', 'Echo', 'GLM-5', 'Gemini 3']],
      },
      {
        name: '同一帧内连续多次开关变化，合并整理后结果正确',
        run: async () => {
          setOn('Alpha', true);
          setOn('Echo', true);
          setOn('Delta', false);
          await settle();
          return seq();
        },
        expected: ['Enabled models (3)', 'Bravo', 'Alpha', 'Echo', 'Disabled models (5)', 'Foxtrot', 'Charlie', 'Delta', 'GLM-5', 'Gemini 3'],
      },
      {
        name: '页面点表头排序（整批重建行）后，两组按页面的新顺序排列',
        run: async () => {
          siteRender(['Echo', 'Bravo', 'Delta', 'Gemini 3', 'Alpha', 'Foxtrot', 'GLM-5', 'Charlie']);
          await settle();
          return seq();
        },
        expected: ['Enabled models (3)', 'Echo', 'Bravo', 'Alpha', 'Disabled models (5)', 'Delta', 'Gemini 3', 'Foxtrot', 'GLM-5', 'Charlie'],
      },
      {
        name: 'Model actions 按钮前有分组开关，默认开启',
        run: () => {
          const toggle = document.querySelector('.user-script-opencode-split-models-toggle');
          return [toggle?.getAttribute('role'), toggle?.getAttribute('aria-checked'), toggle?.nextElementSibling?.getAttribute('aria-label')];
        },
        expected: ['switch', 'true', 'Model actions'],
      },
      {
        name: '关闭分组后，两组合并为一个列表，保持页面的顺序，没有组标题',
        run: async () => {
          document.querySelector('.user-script-opencode-split-models-toggle').click();
          await settle();
          return [document.querySelector('.user-script-opencode-split-models-toggle').getAttribute('aria-checked'), seq()];
        },
        expected: ['false', ['Echo', 'Bravo', 'Delta', 'Gemini 3', 'Alpha', 'Foxtrot', 'GLM-5', 'Charlie']],
      },
      {
        name: '关闭分组时页面重新排序，单一列表跟随页面的新顺序',
        run: async () => {
          siteRender(['Charlie', 'GLM-5', 'Foxtrot', 'Alpha', 'Gemini 3', 'Delta', 'Bravo', 'Echo']);
          await settle();
          return seq();
        },
        expected: ['Charlie', 'GLM-5', 'Foxtrot', 'Alpha', 'Gemini 3', 'Delta', 'Bravo', 'Echo'],
      },
      {
        name: '重新开启分组后，回到两组显示，顺序保持',
        run: async () => {
          document.querySelector('.user-script-opencode-split-models-toggle').click();
          await settle();
          return [document.querySelector('.user-script-opencode-split-models-toggle').getAttribute('aria-checked'), seq()];
        },
        expected: ['true', ['Enabled models (3)', 'Alpha', 'Bravo', 'Echo', 'Disabled models (5)', 'Charlie', 'GLM-5', 'Foxtrot', 'Gemini 3', 'Delta']],
      },
      {
        name: '页面恢复默认顺序，供后面的用例使用',
        run: async () => {
          siteRender(PAGE_ORDER);
          await settle();
          return seq();
        },
        expected: ['Enabled models (3)', 'Bravo', 'Alpha', 'Echo', 'Disabled models (5)', 'Foxtrot', 'Charlie', 'Delta', 'GLM-5', 'Gemini 3'],
      },
      {
        name: '整理完成后不再改动 DOM（不会反复触发）',
        run: async () => {
          const records = [];
          const observer = new MutationObserver((list) => records.push(...list));
          observer.observe(tbody, { childList: true, subtree: true, attributes: true, characterData: true });
          await new Promise((resolve) => setTimeout(resolve, 100));
          observer.disconnect();
          return records.length;
        },
        expected: 0,
      },
      {
        name: '框架整批替换行时，插入位置的参照节点仍在 tbody 内（排序后切换开关不再报错）',
        run: async () => {
          const rows = [...tbody.rows].filter((tr) => tr.querySelector('input[role="switch"]'));
          // 模拟 Solid：整批更新前记住某一行后面的节点，删掉所有行后再用它当插入位置
          const anchor = rows[0].nextSibling;
          for (const tr of rows) tr.remove();
          const probe = document.createElement('tr');
          let result;
          try {
            tbody.insertBefore(probe, anchor);
            result = 'ok';
          } catch {
            result = 'throw';
          }
          probe.remove();
          // 放回原来的行，让脚本重新整理，供后面的用例使用
          for (const tr of rows) tbody.append(tr);
          await settle();
          return result;
        },
        expected: 'ok',
      },
      {
        name: '一个模型都没有时，不显示分组标题',
        run: async () => {
          for (const tr of [...tbody.rows]) {
            if (tr.querySelector('input[role="switch"]')) tr.remove();
          }
          await settle();
          return document.querySelectorAll(`tr[${GROUP_ATTR}]`).length;
        },
        expected: 0,
      },
      {
        name: '页面切换时整张表格被替换，新表格同样被分组',
        run: async () => {
          const table = document.createElement('table');
          table.innerHTML = `
            <thead><tr>
              <th><button type="button"><span>Model</span><span>↕</span></button></th>
              <th><button type="button"><span>Enabled</span><span>↕</span></button></th>
            </tr></thead>
            <tbody>
              <tr><td><span>Lima</span></td><td><input type="checkbox" role="switch" aria-checked="false"></td></tr>
              <tr><td><span>Kilo</span></td><td><input type="checkbox" role="switch" aria-checked="true"></td></tr>
            </tbody>`;
          document.body.append(table);
          await settle();
          const result = [...table.tBodies[0].children].map((tr) => (tr.hasAttribute(GROUP_ATTR) ? tr.textContent.trim() : tr.cells[0].textContent.trim()));
          table.remove();
          return result;
        },
        expected: ['Enabled models (1)', 'Kilo', 'Disabled models (1)', 'Lima'],
      },
    ];

    const results = document.getElementById('results');
    const summary = document.getElementById('summary');

    const addResult = (cells, ok) => {
      const tr = document.createElement('tr');
      for (const text of cells) {
        const td = document.createElement('td');
        const code = document.createElement('code');
        code.textContent = text;
        td.append(code);
        tr.append(td);
      }
      const verdict = document.createElement('td');
      verdict.className = ok ? 'pass' : 'fail';
      verdict.textContent = ok ? '通过' : '失败';
      tr.append(verdict);
      results.append(tr);
    };

    (async () => {
      let passed = 0;
      for (const { name, run, expected } of cases) {
        let actual;
        try {
          actual = await run();
        } catch (error) {
          actual = `异常：${error.message}`;
        }
        const ok = JSON.stringify(actual) === JSON.stringify(expected);
        if (ok) passed += 1;
        addResult([name, JSON.stringify(expected), JSON.stringify(actual)], ok);
      }
      summary.textContent = `通过 ${passed} / ${cases.length} 项`;
    })();
  </script>
</body>
</html>
